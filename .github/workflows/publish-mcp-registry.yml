name: Publish Online Poll Maker to MCP Registry

on:
  push:
    branches: [codex/publish-mcp-registry]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download the manifest and publisher
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/server.json" -o server.json
          curl -fsSL --retry 2 https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/mcp-publisher_linux_amd64.tar.gz -o publisher.tar.gz
          echo '09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4  publisher.tar.gz' | sha256sum -c
          tar -xzf publisher.tar.gz mcp-publisher

      - name: Validate, authenticate, and publish
        run: |
          set -euo pipefail
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
