name: Publish Online Poll Maker to MCP Registry

on:
  push:
    branches: [codex/publish-mcp-registry]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out the Skill repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Download the verified publisher release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/modelcontextprotocol/registry/releases/assets/717387597 \
            -H 'Accept: application/octet-stream' > publisher.tar.gz
          echo '09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4  publisher.tar.gz' | sha256sum -c
          tar -xzf publisher.tar.gz mcp-publisher

      - name: Validate, authenticate, and publish
        run: |
          set -euo pipefail
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
